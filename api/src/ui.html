<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#E9EBE6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141917" media="(prefers-color-scheme: dark)">
<title>Motion Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --page:#E9EBE6; --surface:#F7F8F4; --raised:#FFFFFF; --ink:#1E2925; --ink-2:#4E5A54; --ink-3:#6E7972;
  --line:#D3D8D0; --line-2:#E2E6DF; --accent:#8A5A22; --accent-ink:#FFFFFF; --accent-soft:#EFE5D6;
  --data:#23805A; --ok:#23805A; --warn:#8F6400; --bad:#A8432F; --focus:#2F6FB0;
  --serif:"Noto Serif Thai", Georgia, serif; --sans:"IBM Plex Sans Thai", system-ui, -apple-system, sans-serif;
  --r-lg:14px; --r-md:10px; --r-sm:6px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --page:#141917; --surface:#1B211F; --raised:#222A27; --ink:#E4E8E2; --ink-2:#B3BDB6; --ink-3:#8E9A93;
    --line:#2F3934; --line-2:#262E2B; --accent:#D2A764; --accent-ink:#1A1408; --accent-soft:#2E281D;
    --data:#43A877; --ok:#43A877; --warn:#D9A93F; --bad:#E07A62; --focus:#7FB2E8; color-scheme: dark;
  }
}
:root[data-theme="dark"]{
  --page:#141917; --surface:#1B211F; --raised:#222A27; --ink:#E4E8E2; --ink-2:#B3BDB6; --ink-3:#8E9A93;
  --line:#2F3934; --line-2:#262E2B; --accent:#D2A764; --accent-ink:#1A1408; --accent-soft:#2E281D;
  --data:#43A877; --ok:#43A877; --warn:#D9A93F; --bad:#E07A62; --focus:#7FB2E8; color-scheme: dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--page);color:var(--ink);font:15px/1.6 var(--sans);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit;color:inherit}
select.field{border:1px solid var(--line);border-radius:var(--r-md);background:var(--raised)}
a{color:var(--ink);text-underline-offset:3px}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* frame */
.app{display:grid;grid-template-columns:232px 1fr;min-height:100vh}
.rail{position:sticky;top:0;height:100vh;padding:28px 18px 20px;display:flex;flex-direction:column;gap:28px;border-right:1px solid var(--line)}
.brand{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.2;letter-spacing:.2px;padding:0 10px}
.brand small{display:block;font-family:var(--sans);font-weight:400;font-size:13px;color:var(--ink-3);margin-top:4px;letter-spacing:0}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:var(--r-md);color:var(--ink-2)}
.nav button:hover{background:var(--line-2);color:var(--ink)}
.nav button[aria-current="page"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.nav .n{font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums;font-weight:400}
.nav button:focus-visible{outline:2px solid var(--focus)}
.rail-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
.rail-foot a,.rail-foot button{all:unset;cursor:pointer;padding:7px 10px;border-radius:var(--r-md);color:var(--ink-3);font-size:14px}
.rail-foot a:hover,.rail-foot button:hover{color:var(--ink);background:var(--line-2)}
main{padding:36px 40px 80px;min-width:0;max-width:1180px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:26px;flex-wrap:wrap}
.head h1{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.25;margin:0}
.head p{margin:4px 0 0;color:var(--ink-2)}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:40px;padding:8px 16px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--surface);cursor:pointer;color:var(--ink);text-decoration:none;font-size:14.5px}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--ink-2)}
.btn.quiet:hover{color:var(--ink);background:var(--line-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--r-md);overflow:hidden}
.seg button{all:unset;cursor:pointer;padding:6px 12px;font-size:14px;color:var(--ink-2)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--page)}
.seg button:focus-visible{outline:2px solid var(--focus);outline-offset:-2px}

/* contact sheet */
.sheet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:30px 22px}
.clip{all:unset;cursor:pointer;display:flex;flex-direction:column;gap:10px;border-radius:var(--r-lg)}
.clip:focus-visible{outline:2px solid var(--focus);outline-offset:4px}
.frame{position:relative;aspect-ratio:9/16;border-radius:var(--r-lg);overflow:hidden;background:#20272A;box-shadow:0 1px 0 var(--line), 0 14px 30px -18px rgba(20,30,25,.45)}
.frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s ease}
.clip:hover .frame img{transform:scale(1.025)}
.frame .ep{position:absolute;left:10px;top:10px;padding:2px 8px;border-radius:999px;background:rgba(15,20,18,.62);color:#F2F4EF;font-size:12.5px;font-weight:500;backdrop-filter:blur(6px)}
.clip h3{margin:0;font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.marks{display:flex;gap:6px;flex-wrap:wrap;min-height:22px}
.mark{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;color:var(--ink-2);padding:1px 8px;border:1px solid var(--line);border-radius:999px}
.mark i{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.mark.ok i{background:var(--ok)} .mark.wait i{background:transparent;border:1.5px solid var(--warn)} .mark.bad i{background:var(--bad)}
.sub{font-size:13px;color:var(--ink-3)}

.empty{padding:70px 0;text-align:center;color:var(--ink-2);max-width:460px;margin:0 auto}
.empty h2{font-family:var(--serif);font-weight:600;font-size:20px;color:var(--ink);margin:0 0 6px}

/* drawer */
.drawer.wide{width:min(680px,100%)}
.scrim{position:fixed;inset:0;background:rgba(12,16,14,.42);z-index:40;animation:fade .18s ease}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(480px,100%);background:var(--surface);z-index:41;overflow:auto;box-shadow:-24px 0 60px -30px rgba(0,0,0,.5);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}}
@media (prefers-reduced-motion:reduce){.drawer,.scrim{animation:none}.clip:hover .frame img{transform:none}}
.d-top{position:sticky;top:0;display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line-2);z-index:2}
.d-body{padding:20px 22px 40px;display:flex;flex-direction:column;gap:18px}
.d-video{display:flex;justify-content:center;background:#101513;border-radius:var(--r-lg);overflow:hidden}
.d-video video{width:100%;max-height:52vh;aspect-ratio:9/16;background:#101513}
.d-title{font-family:var(--serif);font-weight:600;font-size:22px;line-height:1.4;margin:0}
.facts{display:grid;grid-template-columns:auto 1fr;gap:4px 16px;font-size:14px;margin:0}
.facts dt{color:var(--ink-3)} .facts dd{margin:0}
.actions{display:flex;gap:8px;flex-wrap:wrap}
.plat{border-top:1px solid var(--line-2)}
.plat-row{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:baseline;padding:11px 0;border-bottom:1px solid var(--line-2);font-size:14px}
.plat-row b{font-weight:600}
.plat-row .st{color:var(--ink-2)} .plat-row .st.ok{color:var(--ok)} .plat-row .st.bad{color:var(--bad)} .plat-row .st.wait{color:var(--warn)}
.plat-row .nums{color:var(--ink-2);font-variant-numeric:tabular-nums;font-size:13px;grid-column:2/4}
.plat-row a{color:var(--ink);text-underline-offset:3px}
h4{margin:6px 0 0;font-size:14px;font-weight:600;color:var(--ink-2)}

/* publish */
.ch{border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;background:var(--raised)}
.ch+.ch{margin-top:10px}
.ch label.top{display:flex;gap:10px;align-items:center;cursor:pointer}
.ch label.top b{font-weight:600}
.ch.off{opacity:.55}
.ch textarea{width:100%;min-height:120px;margin-top:10px;padding:10px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);resize:vertical;line-height:1.55}
.count{font-size:12.5px;color:var(--ink-3);text-align:right;font-variant-numeric:tabular-nums}
.count.over{color:var(--bad);font-weight:600}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:17px;height:17px}
input[type=datetime-local],input[type=password]{width:100%;padding:10px 12px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--raised)}
.radio{display:flex;gap:10px;align-items:center;padding:6px 0;cursor:pointer}
.err{color:var(--bad);font-size:14px;min-height:1px}
.note{font-size:13.5px;color:var(--ink-2);background:var(--accent-soft);border-radius:var(--r-md);padding:10px 12px}
.summary li{margin:6px 0}
.summary .cap{white-space:pre-wrap;color:var(--ink-2);font-size:13.5px}


/* live working view */
.bar.live{height:10px;border-radius:5px;position:relative}
.bar.live i{position:relative;border-radius:5px;transition:none}
.bar.live i::after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,transparent 0,rgba(255,255,255,.45) 50%,transparent 100%);background-size:60px 100%;animation:shim 1.1s linear infinite}
.bar.live.stall i{background:var(--warn)} .bar.live.stall i::after,.bar.live.bad i::after{animation:none;background:none}
.bar.live.bad i{background:var(--bad)}
.bar.live.indet i{width:38%!important;animation:slide 1.6s ease-in-out infinite alternate}
@keyframes shim{from{background-position:-60px 0}to{background-position:60px 0}}
@keyframes slide{from{margin-left:0}to{margin-left:62%}}
.pct{font-variant-numeric:tabular-nums;font-weight:600;font-size:13px}
.who{grid-column:1/3;font-size:14px;color:var(--ink)}
.who small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px}
.clock{grid-column:1/3;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.feed{grid-column:1/3;margin:2px 0 0;padding:10px 12px;background:var(--accent-soft);border-radius:var(--r-md);font-size:12.5px;line-height:1.7;color:var(--ink-2);font-variant-numeric:tabular-nums;max-height:11.5em;overflow-y:auto}
.feed div.new{color:var(--ink);font-weight:500}
.feed div.warn,.feed div.error{color:var(--bad)}
@media (prefers-reduced-motion:reduce){.bar.live i::after,.bar.live.indet i{animation:none}}

/* jobs */
.job{display:grid;grid-template-columns:1fr auto;gap:6px 16px;padding:16px 0;border-bottom:1px solid var(--line)}
.job b{font-family:var(--serif);font-weight:600;font-size:16.5px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;grid-column:1/3}
.bar i{display:block;height:100%;background:var(--data);border-radius:2px}
.job .sub{grid-column:1/3}
.state{font-size:13px;font-weight:500}
.state.bad{color:var(--bad)} .state.wait{color:var(--warn)}

/* analytics */
.lede{font-family:var(--serif);font-size:21px;line-height:1.6;margin:0 0 6px;max-width:62ch}
.lede strong{font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px 22px;margin-top:22px}
.panel h2{margin:0 0 2px;font-size:16px;font-weight:600}
.panel .sub{margin-bottom:12px}
.chart{position:relative}
.chart svg{display:block;width:100%;height:240px;overflow:visible}
.chart .grid line{stroke:var(--line);stroke-width:1}
.chart .axis text{fill:var(--ink-3);font-size:11.5px;font-family:var(--sans)}
.chart .line{fill:none;stroke:var(--data);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:3 3}
.chart .dot{fill:var(--data);stroke:var(--surface);stroke-width:2}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--page);padding:6px 10px;border-radius:var(--r-sm);font-size:13px;white-space:nowrap;transform:translate(-50%,-110%)}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th,td{text-align:right;padding:10px 8px;border-bottom:1px solid var(--line-2);font-size:14px;white-space:nowrap}
th{font-weight:500;color:var(--ink-3);font-size:13px}
th:first-child,td:first-child{text-align:left}
td.name{font-weight:600}
td.views{min-width:170px}
.vb{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.vb span{display:block;height:8px;background:var(--data);border-radius:0 4px 4px 0;min-width:2px}
.scroll{overflow-x:auto;margin:0 -8px;padding:0 8px}
.conn{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.conn div{font-size:14px}
.conn b{display:block;font-weight:600;margin-bottom:2px}
.conn .ok{color:var(--ok)} .conn .bad{color:var(--bad)} .conn .wait{color:var(--warn)}
details summary{cursor:pointer;color:var(--ink-2);font-size:14px;margin-top:10px}


/* studio */
.composer{background:var(--surface);border:1px solid var(--line-2);border-radius:var(--r-lg);padding:20px 22px;display:flex;flex-direction:column;gap:12px}
.composer textarea,.field{width:100%;padding:12px 14px;border-radius:var(--r-md);border:1px solid var(--line);background:var(--raised);line-height:1.55;resize:vertical}
.composer textarea.topic{font-family:var(--serif);font-size:19px;min-height:84px}
.composer .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;cursor:pointer;font-size:14px;color:var(--ink-2)}
.check input{margin-top:3px}
.ideas{display:flex;gap:8px;flex-wrap:wrap}
.ideas button{all:unset;cursor:pointer;font-size:13px;color:var(--ink-2);border:1px dashed var(--line);border-radius:999px;padding:3px 11px}
.ideas button:hover{color:var(--ink);border-color:var(--ink-3)}
.drafts{margin-top:30px}
.drafts h2{font-size:16px;font-weight:600;margin:0 0 6px}
.draft{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:2px 16px;padding:14px 4px;border-bottom:1px solid var(--line);width:100%;box-sizing:border-box}
.draft:hover{background:var(--line-2)}
.draft:focus-visible{outline:2px solid var(--focus)}
.draft b{font-family:var(--serif);font-weight:600;font-size:16.5px;line-height:1.45}
.draft .sub{grid-column:1/3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip{font-size:12.5px;font-weight:500;padding:1px 9px;border-radius:999px;border:1px solid var(--line);white-space:nowrap;align-self:start;margin-top:3px}
.chip.ok{color:var(--ok);border-color:currentColor} .chip.wait{color:var(--warn);border-color:currentColor} .chip.bad{color:var(--bad);border-color:currentColor} .chip.go{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.pulse{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-right:6px;animation:pl 1.2s ease-in-out infinite}
@keyframes pl{50%{opacity:.25}}
@media (prefers-reduced-motion:reduce){.pulse{animation:none}}
.logl{list-style:none;margin:0;padding:0;font-size:13.5px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.logl li{display:grid;grid-template-columns:52px 1fr;gap:8px}
.logl time{color:var(--ink-3);font-variant-numeric:tabular-nums}
.segc{border:1px solid var(--line);border-radius:var(--r-md);background:var(--raised);padding:10px 12px}
.segc+.segc{margin-top:8px}
.segc .top{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;color:var(--ink-3)}
.segc textarea{width:100%;border:0;background:transparent;padding:4px 0 0;resize:vertical;min-height:52px;line-height:1.6;font-size:15px}
.segc textarea:focus{outline:none}
.segc:focus-within{border-color:var(--focus)}
.segc .scr{font-size:13px;color:var(--ink-2);border-top:1px dashed var(--line-2);margin-top:6px;padding-top:6px}
.src{font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line-2)}
.src a{word-break:break-all}
.src .meta{color:var(--ink-3);font-size:12.5px}
.warnl{margin:0;padding-left:18px;font-size:13.5px;color:var(--warn)}
.probl{margin:0;padding-left:18px;font-size:13.5px;color:var(--bad)}
.d-sticky{position:sticky;bottom:0;background:var(--surface);border-top:1px solid var(--line-2);padding:12px 22px;display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end;margin:0 -22px -40px}

/* login */
.login{min-height:100vh;display:grid;place-items:center;padding:24px}
.login form{width:min(340px,100%);display:flex;flex-direction:column;gap:14px}
.login h1{font-family:var(--serif);font-weight:600;font-size:30px;margin:0}
.login p{margin:0 0 6px;color:var(--ink-2)}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:var(--ink);color:var(--page);padding:10px 16px;border-radius:var(--r-md);z-index:60;max-width:90vw;font-size:14px}

@media (max-width:760px){
  .app{grid-template-columns:1fr}
  .rail{position:fixed;top:auto;bottom:0;left:0;right:0;height:auto;flex-direction:row;padding:6px 8px calc(6px + env(safe-area-inset-bottom));border-right:0;border-top:1px solid var(--line);background:var(--surface);z-index:30;gap:0}
  .brand,.rail-foot{display:none}
  .nav{flex-direction:row;width:100%;justify-content:space-around}
  .nav button{flex-direction:column;gap:0;padding:6px 8px;font-size:13px;align-items:center}
  .nav button[aria-current="page"]{box-shadow:inset 0 -2px 0 var(--accent);background:transparent}
  .nav .n{font-size:11.5px}
  main{padding:22px 16px 110px}
  .mobile-top{display:flex!important}
  .head h1{font-size:25px}
  .sheet-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .clip h3{font-size:15px}
  .lede{font-size:18px}
  .panel{padding:16px}
}
.mobile-top{display:none;justify-content:space-between;align-items:center;padding:14px 16px 0}
.mobile-top .brand{display:block;padding:0;font-size:19px}
</style>
</head>
<body>
<div id="root"></div>
<script>
'use strict';
const root = document.getElementById('root');
const SVC = {instagram:'Instagram', facebook:'Facebook', tiktok:'TikTok', twitter:'X'};
const ORDER = ['instagram','facebook','tiktok','twitter'];
const S = {view:'create', counts:{}, channels:null, days:30};
const nf = new Intl.NumberFormat('th-TH');
const fmtN = v => v==null ? '—' : nf.format(Math.round(v));
const fmtD = d => d ? new Date(d).toLocaleString('th-TH',{day:'numeric',month:'short',year:'2-digit',hour:'2-digit',minute:'2-digit'}) : '';
const fmtDay = d => new Date(d+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short'});

function h(tag, attrs, ...kids){
  const e = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v===false || v==null) continue;
    if (k==='class') e.className=v; else if (k==='on') for (const [ev,fn] of Object.entries(v)) e.addEventListener(ev,fn);
    else if (k==='html') e.innerHTML=v; else if (v===true) e.setAttribute(k,''); else e.setAttribute(k,v);
  }
  for (const kid of kids.flat(Infinity)) if (kid!=null && kid!==false && kid!=='') e.append(kid.nodeType?kid:document.createTextNode(String(kid)));
  return e;
}
const put = (node, ...kids) => node.replaceChildren(...kids.flat(Infinity).filter(k=>k!=null && k!==false && k!==''));
async function api(path, opts={}){
  const r = await fetch(path, {credentials:'same-origin', ...opts, headers:{'x-motion-ui':'1','content-type':'application/json',...(opts.headers||{})}});
  let j=null; try{ j=await r.json(); }catch{}
  if (r.status===401 && !path.endsWith('/login')) { login(); throw new Error('unauthorized'); }
  if (!r.ok){ const e=new Error((j&&j.error)||('HTTP '+r.status)); e.body=j; throw e; }
  return j;
}
function toast(msg){ const t=h('div',{class:'toast',role:'status'},msg); document.body.append(t); setTimeout(()=>t.remove(),3200); }

/* post state -> words */
function postState(p){
  if (p.status==='failed') return {cls:'bad', text:'ส่งไม่สำเร็จ'};
  if (p.status==='pending') return {cls:'wait', text:'ค้างอยู่'};
  if (p.post_status==='sent') return {cls:'ok', text:'เผยแพร่แล้ว'};
  if (p.post_status==='error') return {cls:'bad', text:'แพลตฟอร์มปฏิเสธ'};
  if (p.post_status==='deleted') return {cls:'bad', text:'ถูกลบใน Buffer'};
  if (p.mode==='customScheduled' && p.due_at) return {cls:'wait', text:'ตั้งเวลา '+fmtD(p.due_at)};
  if (p.mode==='addToQueue') return {cls:'wait', text:'อยู่ในคิว Buffer'};
  return {cls:'wait', text:'กำลังส่ง'};
}
function latestByService(pubs){
  const m = {};
  for (const p of pubs) if (!m[p.service] || (m[p.service].status==='failed' && p.status!=='failed')) m[p.service]=p;
  return m;
}

/* ---------- login ---------- */
function login(msg){
  const pw = h('input',{type:'password',id:'pw',autocomplete:'current-password',required:true,'aria-label':'รหัสผ่าน',placeholder:'รหัสผ่าน'});
  const err = h('div',{class:'err',role:'alert'},msg||'');
  const form = h('form',{on:{submit:async e=>{ e.preventDefault(); err.textContent='';
      try{ await api('/app/api/login',{method:'POST',body:JSON.stringify({password:pw.value})}); start(); }
      catch(x){ err.textContent = x.message==='wrong password' ? 'รหัสผ่านไม่ถูกต้อง' : x.message==='too many attempts, try again later' ? 'ลองผิดหลายครั้งเกินไป รอ 15 นาทีแล้วลองใหม่' : x.message; pw.value=''; pw.focus(); } }}},
    h('h1',{},'Motion Studio'), h('p',{},'คลังคลิปและการโพสต์'), pw, h('button',{class:'btn primary',type:'submit'},'เข้าสู่ระบบ'), err);
  put(root, h('div',{class:'login'}, form)); pw.focus();
}

function go(v){ S.view=v; S.liveOn=false; try{ localStorage.setItem('ms.view',v); }catch{} load(); }

async function load(){
  try{
    if (S.view==='create'){
      const [st, dr, e] = await Promise.all([api('/app/api/studio/status'), api('/app/api/studio/drafts'), api('/app/api/episodes?tab=ready')]);
      S.formats=st.formats; S.counts={...e.counts, create: dr.drafts.filter(d=>d.status==='ready').length||null}; frame(); studio(st, dr.drafts);
    } else if (S.view==='ready' || S.view==='used'){
      const r = await api('/app/api/episodes?tab='+S.view); S.counts=r.counts; S.eps=r.episodes; frame(); clips();
    } else if (S.view==='working'){
      const [w, e] = await Promise.all([api('/app/api/working'), api('/app/api/episodes?tab=ready')]); S.counts={...S.counts, ...e.counts, working: (w.jobs.length + (w.drafts||[]).length) || null};
      if (!S.liveOn) liveShell(); working(w); if (!LIVE.raf) LIVE.raf = requestAnimationFrame(tick);
    } else {
      const [a, i, e] = await Promise.all([api('/app/api/analytics?days='+S.days), api('/app/api/integrations'), api('/app/api/episodes?tab=ready')]);
      S.counts=e.counts; frame(); analytics(a, i);
    }
  }catch(x){ if (x.message!=='unauthorized') toast(x.message); }
}

/* ---------- drawer ---------- */
function drawer(build, wide){
  const scrim = h('div',{class:'scrim',on:{click:()=>close()}});
  const body = h('div',{class:'d-body'});
  const closeBtn = h('button',{class:'btn quiet',on:{click:()=>close()}},'ปิด');
  const titleEl = h('span',{class:'sub'});
  const panel = h('div',{class:'drawer'+(wide?' wide':''),role:'dialog','aria-modal':'true','aria-label':wide?'ร่างคลิป':'รายละเอียดคลิป'}, h('div',{class:'d-top'}, titleEl, closeBtn), body);
  const onKey = e=>{ if(e.key==='Escape') close(); };
  function close(reload){ scrim.remove(); panel.remove(); document.removeEventListener('keydown',onKey); if(reload) load(); }
  document.addEventListener('keydown',onKey);
  document.body.append(scrim, panel);
  build({body, titleEl, close});
  closeBtn.focus();
}

        p.link ? h('a',{href:p.link,target:'_blank',rel:'noopener'},'เปิดโพสต์') : (p.status==='pending' ? h('button',{class:'btn quiet',on:{click:async()=>{ await api('/app/api/publications/'+p.id+'/clear',{method:'POST'}); close(true); }}},'ล้างสถานะค้าง') : h('span',{})),

      h('div',{class:'d-video'}, h('video',{controls:true,preload:'metadata',playsinline:true,poster:ep.thumbnail_url||false,src:ep.video_url})),
      h('h2',{class:'d-title'}, ep.title),

/* ---------- publish ---------- */
async function publish(ep, body, close){
  put(body, h('p',{class:'sub'},'กำลังโหลดช่องจาก Buffer…'));
  if (!S.channels || S.channels.error) { try{ S.channels = await api('/app/api/channels'); }catch(x){ S.channels={configured:true,channels:[],error:x.message}; } }
  const C = S.channels;
  // refresh this clip's publications first, so a post made a moment ago (here, in another tab, or inside Buffer) is never offered again
  try{ const [a,b] = await Promise.all([api('/app/api/episodes?tab=ready'), api('/app/api/episodes?tab=used')]); const fresh=[...a.episodes,...b.episodes].find(e=>e.id===ep.id); if (fresh) ep = fresh; }catch{}
  const live = p => p.status==='sent' || p.status==='pending';
  const taken = new Map(ep.publications.filter(live).map(p=>[p.channel_id, p]));
  const lastFail = new Map(ep.publications.filter(p=>p.status==='failed').map(p=>[p.channel_id, p]));
  const sel = [];
  const chans = [...(C.channels||[])].sort((a,b)=>ORDER.indexOf(a.service)-ORDER.indexOf(b.service)).map(ch=>{
    const done = taken.has(ch.id);
    const cb = h('input',{type:'checkbox',disabled:done});
    const ta = h('textarea',{'aria-label':'ข้อความสำหรับ '+SVC[ch.service]});
    ta.value = ep.captions[ch.service]||'';
    const cnt = h('div',{class:'count','aria-live':'polite'});
    const upd = ()=>{ const n=[...ta.value].length; if(ch.service==='twitter'){ cnt.textContent=n+' / 280'; cnt.className='count'+(n>280?' over':''); } else cnt.textContent=n+' ตัวอักษร'; };
    ta.addEventListener('input',upd); upd();
    const edit = h('div',{hidden:true}, ta, cnt);
    cb.addEventListener('change',()=>{ edit.hidden=!cb.checked; });
    sel.push({cb, ta, ch});
    const t = taken.get(ch.id), f = !done && lastFail.get(ch.id);
    const tag = t ? (t.status==='pending' ? 'ค้างอยู่ ตรวจใน Buffer ก่อน' : postState(t).text) : '';
    return h('div',{class:'ch'+(done?' off':'')}, h('label',{class:'top'}, cb, h('b',{},SVC[ch.service]), h('span',{class:'sub'},ch.name), done?h('span',{class:'sub',style:'margin-left:auto'},tag+' · โพสต์ซ้ำไม่ได้'):''),
      f ? h('div',{class:'sub',style:'margin-top:4px;color:var(--bad)'},'ครั้งก่อนไม่สำเร็จ: '+(f.error||'')+' — โพสต์ใหม่ได้ แต่อย่ากด Share now กับโพสต์เดิมใน Buffer อีก') : '', edit);
  });
  const missing = (C.not_connected||[]).map(s=>h('div',{class:'ch off'}, h('b',{},SVC[s]), h('div',{class:'sub'},'ยังไม่ได้เชื่อมใน Buffer')));
  const note = !C.configured ? 'ยังไม่ได้ตั้งค่า BUFFER_API_KEY บนเซิร์ฟเวอร์' : C.error ? 'โหลดช่องจาก Buffer ไม่ได้: '+C.error : '';
  const modes = [['addToQueue','เข้าคิวของ Buffer','โพสต์ตามช่วงเวลาที่ตั้งไว้ใน Buffer'],['shareNow','โพสต์ทันที',''],['customScheduled','ตั้งเวลาเอง','']];
  let mode = 'addToQueue';
  const due = h('input',{type:'datetime-local',hidden:true,'aria-label':'เวลาโพสต์'});
  const modeBox = h('div',{role:'radiogroup','aria-label':'เวลาโพสต์'}, modes.map(([v,l,d])=>h('label',{class:'radio'}, h('input',{type:'radio',name:'mode',value:v,checked:v===mode,on:{change:()=>{ mode=v; due.hidden = v!=='customScheduled'; }}}), h('span',{},l, d?h('span',{class:'sub'},'  '+d):''))), due);
  const err = h('div',{class:'err',role:'alert'});

  const allDone = sel.length>0 && sel.every(x=>x.cb.disabled);
  function pick(){
    if (allDone){
      put(body, h('h2',{class:'d-title'},'โพสต์ครบทุกช่องแล้ว'), h('p',{class:'sub'},'คลิปนี้อยู่ในทุกช่องที่เชื่อมกับ Buffer แล้ว จึงโพสต์ซ้ำไม่ได้'), h('div',{},chans,missing),
        h('div',{class:'actions'}, h('button',{class:'btn',on:{click:()=>{ close(); detail(ep); }}},'กลับ')));
      return;
    }
    put(body, h('h2',{class:'d-title'},'โพสต์ “'+ep.title+'”'), h('p',{class:'sub',style:'margin:-10px 0 0'}, 'เลือกช่องและแก้ข้อความได้'+(C.organization?' · Buffer: '+C.organization:'')),
      note?h('div',{class:'note'},note):'', h('div',{},chans,missing), h('h4',{},'เวลา'), modeBox, err,
      h('div',{class:'actions'}, h('button',{class:'btn quiet',on:{click:()=>{ close(); detail(ep); }}},'ยกเลิก'), h('button',{class:'btn primary',on:{click:review}},'ตรวจทานก่อนโพสต์')));
  }
  function review(){
    err.textContent='';
    const picked = sel.filter(s=>s.cb.checked);
    if (!picked.length){ err.textContent='เลือกอย่างน้อยหนึ่งช่อง'; return; }
    if (picked.some(s=>s.ch.service==='twitter' && [...s.ta.value].length>280)){ err.textContent='ข้อความสำหรับ X ยาวเกิน 280 ตัวอักษร'; return; }
    let dueIso;
    if (mode==='customScheduled'){ const t=due.value?new Date(due.value):null; if(!t||t.getTime()<Date.now()+120000){ err.textContent='เลือกเวลาที่ห่างจากตอนนี้อย่างน้อย 2 นาที'; return; } dueIso=t.toISOString(); }
    const label = modes.find(m=>m[0]===mode)[1] + (dueIso?' — '+fmtD(dueIso):'');
    const err2 = h('div',{class:'err',role:'alert'});
    const go = h('button',{class:'btn primary',on:{click:async()=>{
      go.disabled=true; go.textContent='กำลังโพสต์…';
      try{ const res = await api('/app/api/episodes/'+ep.id+'/publish',{method:'POST',body:JSON.stringify({confirm:true,mode,dueAt:dueIso,posts:picked.map(s=>({channelId:s.ch.id,text:s.ta.value}))})}); result(res); }
      catch(x){ err2.textContent=x.message; go.disabled=false; go.textContent='ยืนยันและโพสต์'; }
    }}},'ยืนยันและโพสต์');
    put(body, h('h2',{class:'d-title'},'ตรวจทานก่อนโพสต์'),
      h('dl',{class:'facts'}, h('dt',{},'คลิป'), h('dd',{},ep.title), h('dt',{},'เวลา'), h('dd',{},label)),
      h('ul',{class:'summary'}, picked.map(s=>h('li',{}, h('b',{},SVC[s.ch.service]+' · '+s.ch.name), h('div',{class:'cap'}, s.ta.value.length>220? s.ta.value.slice(0,220)+'…' : s.ta.value || '(ไม่มีข้อความ)')))),
      h('p',{class:'note'},'กดยืนยันแล้วจะส่งไป Buffer ทันที คลิปจะย้ายไปแท็บเสร็จแล้วและติ๊กว่าใช้แล้วใน Notion'),
      err2, h('div',{class:'actions'}, h('button',{class:'btn quiet',on:{click:pick}},'กลับไปแก้'), go));
  }
  function result(res){
    put(body, h('h2',{class:'d-title'}, res.ok?'ส่งไป Buffer แล้ว':'บางช่องส่งไม่สำเร็จ'),
      h('div',{class:'plat'}, res.results.map(r=>h('div',{class:'plat-row'}, h('b',{},SVC[r.service]||r.service),
        h('span',{class:'st '+(r.status==='sent'?'ok':r.status==='skipped'?'wait':'bad')}, r.status==='sent'?'ส่งแล้ว':r.status==='skipped'?(/in Buffer/.test(r.error||'')?'ข้าม เพราะคลิปนี้อยู่ในช่องนี้ใน Buffer แล้ว':'ข้าม เพราะโพสต์ช่องนี้ไปแล้ว'):'ไม่สำเร็จ', r.error&&r.status!=='skipped'?h('div',{class:'sub'},r.error):''), h('span',{})))),
      res.moved_to_used ? h('p',{class:'sub'},'ย้ายคลิปไปแท็บเสร็จแล้ว และกำลังบันทึกลง Notion') : '',
      h('div',{class:'actions'}, h('button',{class:'btn primary',on:{click:()=>close(true)}},'เสร็จ')));
  }
  pick();
}


/* ---------- studio: topic -> research -> draft -> produce ---------- */
const DSTATE = {queued:['wait','รอคิว'], researching:['wait','กำลังค้นข้อมูล'], writing:['wait','กำลังเขียน'], ready:['go','รอตรวจ'], failed:['bad','ไม่สำเร็จ'], submitted:['ok','ส่งผลิตแล้ว'], discarded:['','ทิ้งแล้ว']};
const TPL = {chat:'แชทมือถือ', versus:'ปะทะ VS', scale:'เทียบขนาด', hook:'เปิดเรื่อง', number:'ตัวเลขนับขึ้น', compare:'เทียบแท่ง', bars:'จัดอันดับ', list:'รายการ', quiz:'ทายก่อน', reveal:'เฉลย', dots:'x ใน N', timeline:'ไทม์ไลน์', truth:'จริงหรือไม่', scenario:'ฉากสมมติ', icons:'ไอคอน', outro:'ปิดท้าย'};
const IDEAS = ['ถ้าคนไทยทุกคนเลิกดื่มชานมไข่มุก 1 ปี จะเกิดอะไรขึ้น?','ถ้ากรุงเทพฯ ไม่มีรถติดเลย 1 วัน เราจะได้เวลาคืนกี่ชั่วโมง?','ถ้าคนไทยนอนครบ 8 ชั่วโมงทุกคน จะเกิดอะไรขึ้น?'];
const hhmm = d => new Date(d).toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit'});
function draftState(d){
  if (d.status==='submitted'){
    if (d.job_status==='READY_TO_POST') return ['ok', d.episode_number? 'เสร็จ · EP'+String(d.episode_number).padStart(3,'0') : 'เสร็จแล้ว'];
    if (d.job_status==='FAILED') return ['bad','ผลิตไม่สำเร็จ'];
    return ['wait','กำลังผลิต · '+(STAGE[d.job_status]||d.job_status||'')];

  const bad = j.status==='FAILED' || j.status==='CANCELLED';
  c.mode='job'; c.bad=bad; c.title.textContent = j.title || j.id.slice(0,8);
  const st = bad ? (j.stage||'') : j.status;
  c.target = Math.max(0, Math.min(1, +j.progress||0)); c.ceil = bad ? c.target : (CEIL[st] ?? c.target+.05);
  if (c.shown===0 || bad) c.shown = bad ? c.target : Math.max(c.shown, c.target*0.9);
  const last = Math.max(+new Date(j.updated_at), j.last_event_at ? +new Date(j.last_event_at) : 0);
  c.last = last; c.stalledAfter = 120000; c.beat = j.locked_until ? +new Date(j.locked_until) - 600000 : 0;  // worker renews a 10-min lock every 60s
  c.state.className = 'state '+(bad?'bad':'wait'); c.state.textContent = bad ? (STAGE[j.status]+' ที่ขั้น '+(STAGE[j.stage]||j.stage||'')) : (STAGE[j.status]||j.status);
  c.who.replaceChildren(h('div',{}, bad ? 'หยุดแล้ว — กด "ทำต่อจากขั้นที่ค้าง" ได้ ระบบใช้ผลที่ทำเสร็จแล้วต่อ ไม่เสียเครดิตเสียงซ้ำ' : (WHO[st] || st)),
    h('small',{}, 'สคริปต์เขียนโดย: '+whoWrote(j.draft_model, j.draft_reasoning)+' · เสียงพากย์: ElevenLabs · ภาพ: โค้ด (ไม่ใช้ AI สร้างภาพ)'));
  setFeed(c, (j.events||[]).map(e=>({k:e.id, t:tm(e.created_at), m:e.message, lv:e.level})));
  c.created = +new Date(j.created_at); c.ended = bad ? +new Date(j.updated_at) : 0;
  const se = (j.events||[]).filter(e=>e.status===j.status && /started$/.test(e.message)).pop(); c.stageStart = se ? +new Date(se.created_at) : 0;
  if (!c.clock){ c.clock = h('div',{class:'clock'}); c.sub.before(c.clock); }
  c.sub.replaceChildren('ลองแล้ว '+j.attempts+' จาก '+j.max_attempts+' ครั้ง', j.error ? h('div',{style:'color:var(--bad)'},String(j.error).slice(0,280)) : '');
  c.act.replaceChildren(...(bad ? [h('button',{class:'btn primary',on:{click:async()=>{ try{ await api('/app/api/jobs/'+j.id+'/retry',{method:'POST'}); toast('เริ่มทำต่อจากขั้นที่ค้างแล้ว'); load(); }catch(x){ toast(x.message); } }}},'ทำต่อจากขั้นที่ค้าง')] : []));
  c.bar.classList.toggle('bad', bad); c.bar.classList.remove('indet');
}
function patchDraft(c, d){
  c.mode='draft'; c.bad=false; c.title.textContent = 'เขียนคลิป: '+d.topic;
  c.state.className='state wait'; c.state.textContent = DSTAT[d.status]||d.status;
  c.beat = 0; c.target = DFLOOR[d.status] ?? .1; c.ceil = c.target + .3; c.last = +new Date(d.updated_at); c.stalledAfter = 240000;
  if (c.shown < c.target) c.shown = c.target*0.9;
  c.who.replaceChildren(h('div',{}, 'LLM ที่กำลังคิดอยู่: '+whoWrote(d.model, d.reasoning)), h('small',{}, 'ค้นข้อมูลล่าสุดด้วย Firecrawl แล้วเขียนสคริปต์ ฉาก และคำบรรยาย ก่อนส่งเข้ากฎตรวจ'));
  setFeed(c, (d.log||[]).map((l,i)=>({k:l.at+i, t:tm(l.at), m:l.msg})));
  c.created = +new Date(d.created_at); c.ended = 0; c.stageStart = 0;
  if (!c.clock){ c.clock = h('div',{class:'clock'}); c.sub.before(c.clock); }
  c.sub.textContent = 'เริ่มเมื่อ '+fmtD(d.created_at); c.act.replaceChildren(); c.bar.classList.remove('bad');
}
function working(w){
  LIVE.off = w.now ? Date.parse(w.now)-Date.now() : 0;
  const items = [...(w.drafts||[]).map(d=>({key:'d'+d.id, kind:'d', v:d})), ...w.jobs.map(j=>({key:'j'+j.id+((j.status==='FAILED'||j.status==='CANCELLED')?'x':''), kind:'j', v:j}))];
  const keep = new Set(items.map(x=>x.key));
  for (const [k,c] of LIVE.cards) if (!keep.has(k)){ c.el.remove(); LIVE.cards.delete(k); }
  const empty = LIVE.box.querySelector('.empty');
  if (!items.length){ if (!empty) LIVE.box.append(h('div',{class:'empty'}, h('h2',{},'ไม่มีงานค้าง'), h('p',{},'ทุกคลิปทำเสร็จแล้ว'))); return; }
  if (empty) empty.remove();
  items.forEach((x,i)=>{
    let c = LIVE.cards.get(x.key); if (!c){ c = mkCard(x.key); LIVE.cards.set(x.key,c); }
    x.kind==='d' ? patchDraft(c, x.v) : patchJob(c, x.v);
    if (LIVE.box.children[i] !== c.el) LIVE.box.insertBefore(c.el, LIVE.box.children[i]||null);
  });
}
function tick(){
  LIVE.raf = 0;
  if (S.view!=='working' || !S.liveOn) return;
  const now = srvNow();
  for (const c of LIVE.cards.values()){
    const idle = now - (c.last||now), alive = !c.bad && c.beat && (now - c.beat) < 150000, quiet = !c.bad && idle > c.stalledAfter, stall = quiet && !alive;
    c.bar.classList.toggle('stall', stall);
    if (!c.bad && !RM){
      if (c.shown < c.target) c.shown = Math.min(c.target, c.shown + (c.target-c.shown)*0.12 + 0.0003);  // catch up to the real value quickly
      else if (!stall){ const lim = Math.min(c.ceil-0.015, c.target + (c.ceil-c.target)*0.45); c.shown += Math.max(0,(lim-c.shown))*0.0018; } // then keep creeping so it never looks frozen (not while stalled)
    } else if (c.bad || RM) c.shown = c.target;
    const pct = Math.round(Math.min(c.shown, 1)*100);
    if (c.clock && c.created){ const end = c.ended || now; const txt = 'เวลารวม '+fmtDur((end-c.created)/1000)+(c.ended?' (หยุดที่นี่)':'')+(c.stageStart && !c.ended ? ' · ขั้นนี้ '+fmtDur((now-c.stageStart)/1000) : '');
      if (c.clock.textContent !== txt) c.clock.textContent = txt; }
    c.fill.style.width = (c.shown*100).toFixed(2)+'%';
    c.bar.setAttribute('aria-valuenow', pct);
    c.pct.textContent = c.bad ? pct+'%' : (stall ? pct+'% · ไม่มีความเคลื่อนไหว '+mmss(idle)+' (อาจรอ worker รับงานต่อ)' : quiet ? pct+'% · worker ยังทำงานอยู่ (สัญญาณชีพ '+mmss(now-c.beat)+' ที่แล้ว) ขั้นนี้ไม่มีรายงานย่อย' : pct+'% · อัปเดตล่าสุด '+mmss(idle)+' ที่แล้ว');
  }
  LIVE.raf = requestAnimationFrame(tick);
}

function lineChart(series, key){
  const W=720, H=240, L=48, R=12, T=14, B=28;
  const vals = series.map(d=>d[key]||0), max = Math.max(1, ...vals);
  const step = niceStep(max/4), top = Math.ceil(max/step)*step;
  const x = i => L + (series.length===1?0:(i*(W-L-R)/(series.length-1)));
  const y = v => T + (H-T-B) * (1 - v/top);
  const ns='http://www.w3.org/2000/svg', s=(t,a)=>{ const e=document.createElementNS(ns,t); for(const k in a) e.setAttribute(k,a[k]); return e; };
  const svg = s('svg',{viewBox:`0 0 ${W} ${H}`,preserveAspectRatio:'none',role:'img','aria-label':'กราฟยอดดูสะสมรายวัน'});
  const g = s('g',{class:'grid'}), ax = s('g',{class:'axis'});
  for (let v=0; v<=top; v+=step){ g.append(s('line',{x1:L,x2:W-R,y1:y(v),y2:y(v)})); const t=s('text',{x:L-8,y:y(v)+4,'text-anchor':'end'}); t.textContent=compact(v); ax.append(t); }
  const every = Math.ceil(series.length/6);
  series.forEach((d,i)=>{ if(i%every===0||i===series.length-1){ const t=s('text',{x:x(i),y:H-8,'text-anchor':i===0?'start':i===series.length-1?'end':'middle'}); t.textContent=fmtDay(d.date); ax.append(t);} });
  const path = s('path',{class:'line',d:series.map((d,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(d[key]||0).toFixed(1)).join(' '),'vector-effect':'non-scaling-stroke'});
  const cross = s('line',{class:'cross',y1:T,y2:H-B,visibility:'hidden','vector-effect':'non-scaling-stroke'});
  const dot = s('circle',{class:'dot',r:4.5,visibility:'hidden'});
  svg.append(g, ax, path, cross, dot);
  const wrap = h('div',{class:'chart'}); wrap.append(svg);
  const tip = h('div',{class:'tip',hidden:true}); wrap.append(tip);
  svg.addEventListener('pointermove', e=>{
    const r = svg.getBoundingClientRect(), px = (e.clientX - r.left) * W / r.width;
    let i = Math.round((px-L)/((W-L-R)/Math.max(1,series.length-1))); i=Math.max(0,Math.min(series.length-1,i));
    const d = series[i];
    cross.setAttribute('x1',x(i)); cross.setAttribute('x2',x(i)); cross.setAttribute('visibility','visible');
    dot.setAttribute('cx',x(i)); dot.setAttribute('cy',y(d[key]||0)); dot.setAttribute('visibility','visible');
    tip.hidden=false; tip.textContent = fmtDay(d.date)+'  ·  ดู '+fmtN(d[key]);
    tip.style.left = (x(i)*r.width/W)+'px'; tip.style.top = (y(d[key]||0)*r.height/H)+'px';
  });
  svg.addEventListener('pointerleave', ()=>{ cross.setAttribute('visibility','hidden'); dot.setAttribute('visibility','hidden'); tip.hidden=true; });
  return wrap;
}
function niceStep(raw){ const p=Math.pow(10,Math.floor(Math.log10(Math.max(raw,1)))); const f=raw/p; return (f<=1?1:f<=2?2:f<=5?5:10)*p; }
function compact(v){ return v>=1e6? (v/1e6).toFixed(v%1e6?1:0)+'M' : v>=1e3? (v/1e3).toFixed(v%1e3?1:0)+'K' : String(v); }

async function start(){
  try{
    const me = await api('/app/api/me');
    if (!me.ui_enabled){ put(root, h('div',{class:'login'}, h('div',{}, h('h1',{},'Motion Studio'), h('p',{},'หน้านี้ยังปิดอยู่ ตั้งค่า MOTION_UI_PASSWORD บน Railway แล้ว deploy ใหม่')))); return; }
    if (!me.authed) return login();
    try{ const v=localStorage.getItem('ms.view'); if (v && VIEWS.some(x=>x[0]===v)) S.view=v; }catch{}
    load();
  }catch(x){ if (x.message!=='unauthorized') root.textContent=x.message; }
}
